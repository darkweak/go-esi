version: "2"
run:
  issues-exit-code: 1
linters:
  default: all
  disable:
    - bodyclose
    - cyclop
    - depguard
    - embeddedstructfieldcheck
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - funcorder
    - gochecknoglobals
    - inamedparam
    - ireturn
    - mnd
    - nestif
    - noinlineerr
    - nonamedreturns
    - revive
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
